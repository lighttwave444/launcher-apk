*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

.ic:active{transform:scale(.9)}

.ptr{position:absolute;left:0;top:0;transform-origin:8% 7%;width:calc(max(26px,6cqw)*var(--ps,1));pointer-events:none;z-index:99999;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}

.body{flex:1;position:relative;background:#fff;color:#111;min-height:0}

.status span,.search,.bar b,.card,.card small{user-select:text;-webkit-user-select:text}

.home{z-index:99990}
.kb{position:absolute;left:0;right:0;bottom:0;z-index:99980;display:none;flex-direction:column;gap:1.5cqw;padding:1.4cqw 1.2cqw calc(env(safe-area-inset-bottom,0px) + 5.4cqw);border-radius:5cqw 5cqw 0 0;background:linear-gradient(180deg,rgba(34,36,48,.74),rgba(16,18,26,.88));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1.5px solid rgba(255,255,255,.45);box-shadow:0 -8px 28px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none}

.grid.gone,.dock.gone,.all.gone{transform:translateX(-125%);opacity:0;pointer-events:none}
/* ===== todos os apps instalados (dentro da gaveta de cima) ===== */
.all{position:absolute;left:4cqw;right:4cqw;top:calc(env(safe-area-inset-top,0px) + 77.6cqw + 40.8cqw*(var(--is,1) - 1));bottom:calc(env(safe-area-inset-bottom,0px) + 24.5cqw);display:flex;flex-direction:column;border-radius:6cqw;overflow:hidden;background:rgba(0,0,0,.2);backdrop-filter:blur(calc(var(--bl,10px)*1.4)) saturate(1.4);-webkit-backdrop-filter:blur(calc(var(--bl,10px)*1.4)) saturate(1.4);border:1.5px solid rgba(255,255,255,.4)}
.ah{flex:none;padding:3cqw 4cqw 2cqw;font-size:max(12px,3.3cqw);font-weight:600;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.4)}

.phone,.phone *{cursor:none!important}

/* texto: posicao dos caracteres de uma textarea. Um espelho invisivel guarda o texto e cada letra so e medida quando precisa (rapido mesmo com texto grande) */
let ic=null;
/* largura real do texto, medida por uma caixa escondida com o mesmo estilo da caixa de texto */
function probeW(ta,text){let p=ta._pr;
 if(!p||!p.isConnected){p=document.createElement('textarea');p.tabIndex=-1;p.setAttribute('aria-hidden','true');p.setAttribute('wrap','off');
  p.style.cssText='position:absolute;left:-9999px;top:0;width:1px;height:1px;min-height:0;padding:0;border:0;visibility:hidden;overflow:scroll;white-space:pre;pointer-events:none';
  (ta.parentNode||document.body).append(p);ta._pr=p}
 p.value=text;return p.scrollWidth}
const MX=99999;
function mir(ta){
 const v=ta.value,cs=getComputedStyle(ta),key=ta.clientWidth+'|'+cs.fontSize+'|'+cs.fontFamily+'|'+cs.lineHeight+'|'+cs.paddingLeft+'|'+cs.paddingTop+'|'+cs.letterSpacing;
 if(!ic||ic.ta!==ta||!ic.m.isConnected||ic.key!==key){
  if(ic&&ic.m.isConnected)ic.m.remove();
  const m=document.createElement('div');
  m.style.cssText='position:fixed;left:-'+MX+'px;top:0;visibility:hidden;pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word;box-sizing:border-box;border:0;margin:0;width:'+ta.clientWidth+'px';
  ['fontFamily','fontSize','fontWeight','fontStyle','fontVariant','letterSpacing','wordSpacing','wordBreak','lineHeight','textIndent','textTransform','tabSize','paddingTop','paddingRight','paddingBottom','paddingLeft'].forEach(k=>m.style[k]=cs[k]);
  const n=document.createTextNode(v);m.append(n);document.body.append(m);
  ic={ta,key,m,n,v,rg:document.createRange(),R:[],f:ta._f||1,fok:false,l0:parseFloat(cs.paddingLeft)||0};if(ic.f!==1)fitW(ic)}
 else if(ic.v!==v){ic.v=v;ic.n.data=v;ic.R=[]}
 return ic}
function rrect(i){const c=ic;let r=c.R[i];if(r!==undefined)return r;
 c.rg.setStart(c.n,i);c.rg.setEnd(c.n,i+1);const q=c.rg.getBoundingClientRect();
 r=q.height?[q.left+MX,q.right+MX,q.top,q.bottom]:null;c.R[i]=r;return r}
/* retangulo do caractere, ou o do vizinho mais perto quando ele nao tem (ex.: espaco recolhido) */
function rrn(i){const n=ic.v.length;let j=i;while(j>=0&&!rrect(j))j--;if(j>=0)return rrect(j);j=i;while(j<n&&!rrect(j))j++;return j<n?rrect(j):null}
/* se o espelho sai mais largo/estreito que a caixa real, a largura dele muda na mesma proporcao para as quebras de linha ficarem nos mesmos lugares */
function fitW(c){const cs=getComputedStyle(c.ta),pl=parseFloat(cs.paddingLeft)||0,pr=parseFloat(cs.paddingRight)||0;c.m.style.width=(pl+pr+(c.ta.clientWidth-pl-pr)/c.f)+'px';c.R=[]}
/* ajusta a largura do espelho a largura real do texto na propria caixa (evita o cursor adiantado) */
function calib(){const c=ic;if(c.fok)return;const v=c.v,n=v.length;let i=0,tries=0;
 while(i<n&&tries<4){tries++;const r0=rrect(i);if(!r0||v[i]==='\n'){i++;continue}
  const t=r0[2];let e=i;while(e+1<n&&v[e+1]!=='\n'){const q=rrect(e+1);if(q&&Math.abs(q[2]-t)<2)e++;else break}
  const w=rrect(e)[1]-r0[0];
  if(w>80){const pw=probeW(c.ta,v.slice(i,e+1)),f=pw/w;if(pw>0&&f>.5&&f<2){c.f=Math.abs(f-1)>.003?f:1;c.ta._f=c.f;c.fok=true;if(c.f!==1)fitW(c)}return}
  i=e+1}}
function idxAt(ta,x,y){
 const v=ta.value,len=v.length;if(!len)return 0;
 const c=mir(ta);calib();
 const bx=ta.getBoundingClientRect(),ox=bx.left+ta.clientLeft,oy=bx.top+ta.clientTop-ta.scrollTop,yy=y-oy;
 const last=rrn(len-1);if(!last)return len;if(yy>last[3])return len;
 let lo=0,hi=len-1;
 while(lo<hi){const mid=(lo+hi)>>1,r=rrn(mid);if(r&&r[3]>=yy)hi=mid;else lo=mid+1}

function txtAt(u){
 const ta=u.el&&u.el.closest&&u.el.closest('textarea');
 if(ta)return{ta,i:idxAt(ta,u.tx,u.ty)};

 if(!r&&document.caretPositionFromPoint){const p=document.caretPositionFromPoint(u.tx,u.ty);if(p){r=document.createRange();r.setStart(p.offsetNode,p.offset)}}

function selTo(a,b){

/* duplo toque: seleciona a palavra que a ponta do ponteiro esta tocando (textarea ou texto selecionavel) */
const WC=/[\p{L}\p{N}\p{M}_]/u;
function wordSpan(v,i){let c=i;if(!(c<v.length&&WC.test(v[c]))){if(c>0&&WC.test(v[c-1]))c--;else return null}
 let s=c,f=c+1;while(s>0&&WC.test(v[s-1]))s--;while(f<v.length&&WC.test(v[f]))f++;return[s,f]}

 if(a.ta){const r=wordSpan(a.ta.value,a.i);if(r){focusQuiet(a.ta);a.ta.setSelectionRange(r[0],r[1]);return{ta:a.ta,s:r[0],f:r[1]}}}
 else if(a.node&&a.node.nodeType===3){const r=wordSpan(a.node.data,a.off);if(r){getSelection().setBaseAndExtent(a.node,r[0],a.node,r[1]);return{node:a.node,s:r[0],f:r[1]}}}}

function focusQuiet(t){if(t.inputMode!=='none'){t.blur();t.inputMode='none'}t.focus({preventScroll:true})}

function menuHit(tx,ty,pad){if(!menu)return null;let best=null,bd=1e9;for(const b of menu.children){const r=b.getBoundingClientRect(),d=Math.hypot(Math.max(r.left-tx,0,tx-r.right),Math.max(r.top-ty,0,ty-r.bottom));if(d<bd){bd=d;best=b}}return bd<=pad?best:null}

 const a=document.activeElement,ta=a&&a.tagName==='TEXTAREA'&&a.selectionEnd>a.selectionStart?a:null,s=ta&&ta.selectionStart,e=ta&&ta.selectionEnd;

const cc=document.createElement('div');cc.className='cc';
cc.innerHTML='<div class="ccp"><div class="cch"><span>Central de controle</span><button class="ccx" title="Fechar">✕</button></div><div class="ccg">'
 +TILES.map(t=>'<div class="cct" data-k="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></div>').join('')
 +'</div><div class="ccs"><div class="lbl"><span>Brilho do launcher</span><span class="pc"></span></div><div class="sld"><i></i></div></div><div class="cci"></div></div><div class="tst"></div>';
const dim=document.createElement('div');dim.className='dim';

const sld=cc.querySelector('.sld');
function setBr(v,save){br=Math.max(.15,Math.min(1,v));dim.style.opacity=(1-br).toFixed(2);
 sld.firstChild.style.width=((br-.15)/.85*100).toFixed(1)+'%';cc.querySelector('.pc').textContent=Math.round(br*100)+'%';
 if(save)try{localStorage.setItem('br',br)}catch(e){}}
setBr(br);
sld.addEventListener('pointerdown',e=>{e.preventDefault();const id=e.pointerId;
 const set=v=>{const r=sld.getBoundingClientRect();setBr(.15+Math.max(0,Math.min(1,(v.clientX-r.left)/r.width))*.85,1)};
 set(e);const mv=v=>{if(v.pointerId===id)set(v)};
 const up=v=>{if(v.pointerId!==id)return;['pointermove','pointerup','pointercancel'].forEach((t,i)=>window.removeEventListener(t,i?up:mv))};
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)});
function toast(m){const t=cc.querySelector('.tst');t.textContent=m;t.classList.add('on');clearTimeout(tTm);tTm=setTimeout(()=>t.classList.remove('on'),2800)}
function netTxt(){const c=navigator.connection||{};if(!navigator.onLine)return 'sem internet';
 const tp=({wifi:'Wi-Fi',cellular:'dados móveis',ethernet:'cabo',bluetooth:'Bluetooth'})[c.type]||'online',p=[tp];
 if(c.effectiveType)p.push(c.effectiveType.toUpperCase());if(c.downlink)p.push(c.downlink+' Mbps');return p.join(' · ')}
function ccRefresh(){const c=navigator.connection||{},on={wifi:c.type==='wifi',data:c.type==='cellular',torch:!!tStream,awake:!!wl,full:!!document.fullscreenElement,rot:rl,vib:vibOn};
 cc.querySelectorAll('.cct').forEach(t=>t.classList.toggle('on',!!on[t.dataset.k]));
 cc.querySelector('.cci').textContent='Rede: '+netTxt()+'  ·  Bateria '+document.getElementById('bat').textContent}
function toggleCC(on){cc.classList.toggle('on',on);if(on){hideMenu();ccRefresh()}}
function openSet(k){const lab=TILES.find(t=>t[0]===k)[1];
 if(!/Android/i.test(navigator.userAgent)||!/Chrome/i.test(navigator.userAgent)){toast('Abrir ajustes só funciona no Chrome do Android');return}
 toast('Abrindo '+lab+'…');location.href='intent:#Intent;action=android.settings.'+SETS[k]+';end';
 setTimeout(()=>{if(!document.hidden)toast('O navegador não deixou abrir. Use o painel do Android.')},1600)}
async function torchT(){if(tStream){tStream.getTracks().forEach(t=>t.stop());tStream=null;return}
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}),tr=s.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
  if(!cap.torch){s.getTracks().forEach(t=>t.stop());toast('Este celular não deixa o navegador ligar a lanterna');return}
  await tr.applyConstraints({advanced:[{torch:true}]});tStream=s}catch(e){toast('Sem permissão da câmera para a lanterna')}}
async function awakeT(){if(wl){try{await wl.release()}catch(e){}wl=null;return}
 if(!navigator.wakeLock){toast('Este navegador não mantém a tela ligada');return}
 try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;ccRefresh()})}catch(e){toast('Não deu para manter a tela ligada')}}
async function fullT(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){toast('O navegador não deixou usar tela cheia')}}
async function rotT(){if(rl){try{screen.orientation.unlock()}catch(e){}rl=false;return}
 try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();await screen.orientation.lock('portrait');rl=true}catch(e){toast('O navegador não deixou travar a rotação')}}
async function tileAct(k){
 if(SETS[k]){openSet(k);return}
 if(k==='torch')await torchT();else if(k==='awake')await awakeT();else if(k==='full')await fullT();else if(k==='rot')await rotT();
 else if(k==='vib'){vibOn=!vibOn;try{localStorage.setItem('vib',vibOn?1:0)}catch(e){}TH.vib=vibOn?1:0;saveTh();applyTheme();buzz()}
 ccRefresh()}
cc.addEventListener('click',e=>{
 const t=e.target.closest('.cct');if(t){tileAct(t.dataset.k);return}
 if(e.target.closest('.ccx')){toggleCC(false);return}
 if(e.target===cc&&!(e.isTrusted&&e.pointerType==='touch'))toggleCC(false)});
document.querySelector('.status').addEventListener('click',e=>{if(e.isTrusted&&e.pointerType==='touch')return;toggleCC(!cc.classList.contains('on'))});
window.addEventListener('online',ccRefresh);window.addEventListener('offline',ccRefresh);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)rl=false;ccRefresh()});
try{navigator.connection&&navigator.connection.addEventListener('change',ccRefresh)}catch(e){}

/* ===== tema (Ajustes) ===== */
const MODES=[['dark','Escuro'],['light','Claro'],['auto','Automático']];
const ACCS=['#2f7bff','#2fd05a','#9a4dff','#ff4f9a','#ff8a2a','#ff4d4d'];
const WPS=[['Pôr do sol',''],['Noite','linear-gradient(160deg,#0f1226,#2b2f6b 55%,#6a4fa3)'],['Oceano','linear-gradient(170deg,#0a2a43,#1b6a8f 55%,#7fd1c7)'],['Floresta','linear-gradient(165deg,#0d2a1f,#2f6b4a 60%,#b6c98a)'],['Rosa','linear-gradient(160deg,#3a1030,#c2457a 55%,#ffb48a)'],['Grafite','linear-gradient(180deg,#16181d,#2a2e38)']];
const FF={sys:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',serif:'Georgia,"Times New Roman",serif',mono:'ui-monospace,Menlo,Consolas,monospace'};
const DEF={mode:'dark',acc:ACCS[0],wp:0,is:1,ir:'28%',ff:'sys',sp:3,ps:1,bl:10,vib:1,an:1,h12:0};let TH=Object.assign({},DEF);
{let sv={};try{sv=JSON.parse(localStorage.getItem('tema')||'{}')}catch(e){}Object.assign(TH,sv);if(!('vib' in sv))TH.vib=vibOn?1:0}
const mq=matchMedia('(prefers-color-scheme: light)');
function saveTh(){try{localStorage.setItem('tema',JSON.stringify(TH))}catch(e){}}
function applyTheme(){
 const light=TH.mode==='light'||(TH.mode==='auto'&&mq.matches),r=document.documentElement,w=WPS[TH.wp]||WPS[0],st=r.style;
 r.dataset.theme=light?'light':'dark';r.dataset.anim=TH.an?'on':'off';
 st.setProperty('--acc',TH.acc);st.setProperty('--is',TH.is);st.setProperty('--ir',TH.ir);st.setProperty('--ff',FF[TH.ff]||FF.sys);st.setProperty('--bl',TH.bl+'px');st.setProperty('--ps',TH.ps);
 wpx.style.background=w[1];wpx.style.display=w[1]?'block':'none';
 GAIN=TH.sp;vibOn=!!TH.vib;try{localStorage.setItem('vib',TH.vib)}catch(e){}
 if(h12!==TH.h12){h12=TH.h12;tick()}
 document.querySelectorAll('.set .opt').forEach(o=>{const d=o.dataset;o.classList.toggle('on',d.m?d.m===TH.mode:d.a?d.a===TH.acc:d.w!=null?+d.w===TH.wp:d.t?String(TH[d.t])===d.v:false)})}
if(mq.addEventListener)mq.addEventListener('change',applyTheme);
function buildSet(b){
 const s=document.createElement('div');s.className='set';
 const seg=(t,k,l)=>'<div class="sh">'+t+'</div><div class="seg">'+l.map(x=>'<button class="opt" data-t="'+k+'" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
 s.innerHTML='<div class="sh">Aparência</div><div class="seg">'+MODES.map(m=>'<button class="opt" data-m="'+m[0]+'">'+m[1]+'</button>').join('')+'</div>'
 +'<div class="sh">Cor de destaque</div><div class="sw">'+ACCS.map(c=>'<button class="opt c" data-a="'+c+'" style="--s:'+c+'" title="'+c+'"></button>').join('')+'</div>'
 +'<div class="sh">Papel de parede</div><div class="sw w">'+WPS.map((w,i)=>'<button class="opt p" data-w="'+i+'" style="background:'+(w[1]||'linear-gradient(180deg,#5b7fb8,#f2b283 60%,#2c4560)')+'"><span>'+w[0]+'</span></button>').join('')+'</div>'
 +seg('Tamanho dos ícones','is',[[.85,'Pequeno'],[1,'Normal'],[1.15,'Grande']])
 +seg('Formato dos ícones','ir',[['28%','Arredondado'],['50%','Redondo'],['12%','Quadrado']])
 +seg('Fonte','ff',[['sys','Padrão'],['serif','Serifada'],['mono','Mono']])
 +'<button class="opt adv-t">Avançado ▾</button><div class="adv">'
 +seg('Velocidade do ponteiro','sp',[[2,'Lenta'],[3,'Normal'],[4.5,'Rápida'],[6,'Turbo']])
 +seg('Tamanho do ponteiro','ps',[[.8,'Pequeno'],[1,'Normal'],[1.4,'Grande']])
 +seg('Desfoque do vidro','bl',[[0,'Nenhum'],[5,'Leve'],[10,'Normal'],[20,'Forte']])
 +seg('Vibração','vib',[[1,'Ligada'],[0,'Desligada']])
 +seg('Animações','an',[[1,'Ligadas'],[0,'Desligadas']])
 +seg('Relógio','h12',[[0,'24 horas'],[1,'12 horas']])
 +'</div><button class="opt rst">Restaurar padrão</button><small>Para trocar os apps, edite a lista APPS no começo do script do index.html.</small>';
 s.addEventListener('click',e=>{const o=e.target.closest('.opt');if(!o)return;const d=o.dataset;
  if(o.classList.contains('adv-t')){o.textContent=s.querySelector('.adv').classList.toggle('on')?'Avançado ▴':'Avançado ▾';return}
  if(d.m)TH.mode=d.m;else if(d.a)TH.acc=d.a;else if(d.w!=null)TH.wp=+d.w;else if(d.t)TH[d.t]=isNaN(+d.v)?d.v:+d.v;else if(o.classList.contains('rst'))Object.assign(TH,DEF);
  saveTh();applyTheme();buzz()});
 b.append(s);applyTheme()}
applyTheme();

/* janelas */
let z=10,n=0;
function openApp(k){
 const a=APPS[k];if(!a)return;
 if(a.u&&a.u.startsWith('tel:')){location.href=a.u;return}
 const P=phone.getBoundingClientRect(),W=Math.min(P.width*.88,440),H=a.n===2?Math.min(P.height*.66,600):Math.min(P.height*.5,520);
 const w=document.createElement('div');w.className='win';
 w.style.cssText='width:'+W+'px;height:'+H+'px;left:'+((P.width-W)/2+(n%4)*14-21)+'px;top:'+(P.height*.13+(n%4)*28)+'px;z-index:'+(++z);n++;
 w.innerHTML='<div class="bar"><b></b>'+(a.u?'<a target="_blank" rel="noopener" title="Abrir fora">↗</a>':'')+'<button class="x" title="Fechar">✕</button></div><div class="body"></div><div class="rz"></div>';
 w.querySelector('b').textContent=a.t;
 const body=w.querySelector('.body');
 if(a.u)w.querySelector('.bar a').href=a.u;
 if(a.f){const f=document.createElement('iframe');f.src=a.u;f.allow='geolocation';body.append(f)}
 else if(a.n===1){const t=document.createElement('textarea');t.placeholder='Escreva aqui...';try{t.value=localStorage.getItem('nota')||''}catch(e){}t.inputMode='none';t.addEventListener('pointerdown',e=>{if(!e.isTrusted||e.pointerType==='mouse')return;e.preventDefault();focusQuiet(t);const i=idxAt(t,e.clientX,e.clientY);t.setSelectionRange(i,i)});t.addEventListener('contextmenu',e=>e.preventDefault());let sv=0;const flush=()=>{clearTimeout(sv);sv=0;try{localStorage.setItem('nota',t.value)}catch(e){}};t.oninput=()=>{clearTimeout(sv);sv=setTimeout(flush,400)};addEventListener('pagehide',()=>{if(sv)flush()});document.addEventListener('visibilitychange',()=>{if(sv&&document.hidden)flush()});body.append(t)}
 else if(a.n===2){buildSet(body)}
 else{const c=document.createElement('div');c.className='card';c.append(tile(k));c.firstChild.onclick=null;const s=document.createElement('small');s.textContent='Este site não permite abrir dentro de uma janela.';const g=document.createElement('a');g.className='go';g.href=a.u;g.target='_blank';g.rel='noopener';g.textContent='Abrir '+a.t;c.append(s,g);body.append(c)}
 w.addEventListener('pointerdown',()=>{w.style.zIndex=++z},true);
 w.querySelector('.x').onclick=()=>w.remove();
 drag(w.querySelector('.bar'),w,0);drag(w.querySelector('.rz'),w,1);
 phone.insertBefore(w,ptr);
 if(a.n===1){const t=w.querySelector('textarea');if(t)focusQuiet(t)}
 if(phone.querySelectorAll('.win').length>6)phone.querySelector('.win').remove();
}
function drag(h,w,rs){
 h.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,a'))return;
  e.preventDefault();phone.classList.add('dg');
  const id=e.pointerId,s={x:e.clientX,y:e.clientY,l:w.offsetLeft,t:w.offsetTop,w:w.offsetWidth,h:w.offsetHeight},P=phone.getBoundingClientRect();
  const mv=v=>{if(v.pointerId!==id)return;const dx=v.clientX-s.x,dy=v.clientY-s.y;
   if(rs){w.style.width=Math.max(220,Math.min(s.w+dx,P.width-w.offsetLeft))+'px';w.style.height=Math.max(180,Math.min(s.h+dy,P.height-w.offsetTop))+'px'}
   else{w.style.left=Math.max(-s.w+70,Math.min(s.l+dx,P.width-70))+'px';w.style.top=Math.max(0,Math.min(s.t+dy,P.height-50))+'px'}};
  const up=v=>{if(v.pointerId!==id)return;phone.classList.remove('dg');['pointermove','pointerup','pointercancel'].forEach((t,i)=>window.removeEventListener(t,i?up:mv))};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
 });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
